[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "industrial-maintenance-copilot"
version = "0.1.0"
description = "Cost-aware, tenant-isolated industrial maintenance AI copilot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Industrial Maintenance Copilot contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ui = ["pandas>=2.2,<3", "streamlit>=1.42,<2"]
mcp = ["mcp>=1.6,<2"]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]
all = [
  "pandas>=2.2,<3",
  "streamlit>=1.42,<2",
  "mcp>=1.6,<2",
]

[project.scripts]
maintenance-copilot = "app.main:run"
maintenance-seed = "scripts.seed_database:main"
maintenance-eval = "evals.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "dashboard", "evals", "scripts"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: uses a paid external model API and is disabled unless explicitly selected",
  "integration: exercises multiple application layers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["evals/reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"app/db/seed.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
